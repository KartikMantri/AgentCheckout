<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complete Payment — AgentCheckout</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%90</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  :root{
    --paper: #eef1f4; --paper-raised: #ffffff; --ink: #161b22; --ink-soft: #56606f; --ink-faint: #9aa3b0;
    --line: #b7c0cc; --line-soft: #d8dee5;
    --trusted: #1c6363; --trusted-soft: rgba(28,99,99,0.09);
    --boundary: #a23a2c; --boundary-soft: rgba(162,58,44,0.09);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #10141b; --paper-raised: #171d27; --ink: #e8ecf1; --ink-soft: #a9b2c1; --ink-faint: #566073;
      --line: #2d3644; --line-soft: #232b37;
      --trusted: #4bb0a6; --trusted-soft: rgba(75,176,166,0.13);
      --boundary: #dd6a56; --boundary-soft: rgba(221,106,86,0.12);
    }
  }
  :root[data-theme="dark"]{
    --paper: #10141b; --paper-raised: #171d27; --ink: #e8ecf1; --ink-soft: #a9b2c1; --ink-faint: #566073;
    --line: #2d3644; --line-soft: #232b37;
    --trusted: #4bb0a6; --trusted-soft: rgba(75,176,166,0.13);
    --boundary: #dd6a56; --boundary-soft: rgba(221,106,86,0.12);
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    padding: 24px;
  }
  .mono{ font-family: "IBM Plex Mono", monospace; }
  .card{ width: 100%; max-width: 440px; background: var(--paper-raised); border: 1px solid var(--line); padding: 32px 28px; }
  .eyebrow{
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-faint); margin: 0 0 6px;
  }
  h1{ font-family: "IBM Plex Sans Condensed", sans-serif; font-weight: 700; font-size: 22px; margin: 0 0 22px; }
  .row{ display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
  .row span:first-child{ color: var(--ink-faint); }
  .row .amount{ font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  .total-row{ font-size: 19px; font-weight: 600; padding: 16px 0; }
  .total-row .amount{ font-size: 22px; }
  #pay-btn{
    width: 100%; background: var(--ink); color: var(--paper); border: none;
    font-family: "IBM Plex Sans Condensed", sans-serif; font-weight: 600; font-size: 14px;
    padding: 13px; cursor: pointer; margin-top: 20px;
  }
  #pay-btn:hover{ background: var(--boundary); }
  #pay-btn:disabled{ opacity: 0.5; cursor: default; }
  .status{ font-family: "IBM Plex Mono", monospace; font-size: 12.5px; margin-top: 16px; text-align: center; }
  .status.paid{ color: var(--trusted); }
  .status.failed{ color: var(--boundary); }
  .status.info{ color: var(--ink-faint); }
  .footer-note{ font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--ink-faint); text-align: center; margin-top: 22px; line-height: 1.6; }
</style>
</head>
<body>
<div class="card" id="card">
  <p class="eyebrow">AgentCheckout · Secure payment</p>
  <h1>Loading order…</h1>
</div>

<script>
const orderId = location.pathname.split('/').pop();
const card = document.getElementById('card');

async function init(){
  const [order, cfg] = await Promise.all([
    fetch('/api/order/' + orderId).then(r => r.json()),
    fetch('/api/razorpay-config').then(r => r.json()),
  ]);

  if(order.error){
    card.innerHTML = `<p class="eyebrow">AgentCheckout · Secure payment</p><h1>Order not found</h1>
      <p class="status failed">${orderId} doesn't match any known order.</p>`;
    return;
  }

  if(order.status === 'paid'){
    card.innerHTML = `<p class="eyebrow">AgentCheckout · Secure payment</p><h1>${order.id}</h1>
      <div class="row"><span>Total</span><span class="amount">Rs.${order.total}</span></div>
      <p class="status paid">Already paid — nothing more to do here.</p>`;
    return;
  }

  if(order.status === 'pending_approval'){
    card.innerHTML = `<p class="eyebrow">AgentCheckout · Secure payment</p><h1>${order.id}</h1>
      <div class="row"><span>Total</span><span class="amount">Rs.${order.total}</span></div>
      <p class="status info">This order is above the auto-approval limit and is waiting for a store associate to review it. You'll be able to pay here once it's approved.</p>`;
    return;
  }

  if(order.status === 'rejected'){
    card.innerHTML = `<p class="eyebrow">AgentCheckout · Secure payment</p><h1>${order.id}</h1>
      <div class="row"><span>Total</span><span class="amount">Rs.${order.total}</span></div>
      <p class="status failed">This order was reviewed and could not be approved.</p>`;
    return;
  }

  if(cfg.mode !== 'live'){
    card.innerHTML = `<p class="eyebrow">AgentCheckout · Secure payment</p><h1>${order.id}</h1>
      <div class="row"><span>Total</span><span class="amount">Rs.${order.total}</span></div>
      <p class="status info">This environment doesn't have live Razorpay credentials configured, so there's no real payment to complete here.</p>`;
    return;
  }

  card.innerHTML = `
    <p class="eyebrow">AgentCheckout · Secure payment</p>
    <h1>Complete your order</h1>
    <div class="row"><span>Order ID</span><span class="mono">${order.id}</span></div>
    <div class="row total-row"><span>Total due</span><span class="amount">Rs.${order.total}</span></div>
    <button id="pay-btn">Pay with Razorpay</button>
    <div id="status-area"></div>
    <p class="footer-note">Test mode only. You'll be shown Razorpay's real Checkout — use a test card or success@razorpay to complete it.</p>
  `;

  document.getElementById('pay-btn').addEventListener('click', () => {
    const btn = document.getElementById('pay-btn');
    const rzp = new Razorpay({
      key: cfg.key_id,
      amount: order.total * 100,
      currency: 'INR',
      order_id: order.razorpay_order_id,
      name: 'AgentCheckout',
      description: order.id,
      theme: { color: '#161b22' },
      handler: async function(response){
        btn.disabled = true;
        btn.textContent = 'Verifying...';
        const result = await fetch('/api/verify-payment', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            order_id: order.id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature,
          }),
        }).then(r => r.json());
        const statusArea = document.getElementById('status-area');
        if(result.ok){
          statusArea.innerHTML = `<p class="status paid">Paid — ${result.payment.razorpay_payment_id}</p>`;
          btn.style.display = 'none';
        }else{
          statusArea.innerHTML = `<p class="status failed">Verification failed: ${result.reason}</p>`;
          btn.disabled = false;
          btn.textContent = 'Try again';
        }
      },
      modal: { ondismiss: function(){ btn.disabled = false; btn.textContent = 'Pay with Razorpay'; } },
    });
    rzp.open();
  });
}

init();
</script>
</body>
</html>
